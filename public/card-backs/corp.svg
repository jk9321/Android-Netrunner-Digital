<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="corp-chip-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030b18"/>
      <stop offset="50%" stop-color="#02050d"/>
      <stop offset="100%" stop-color="#01040a"/>
    </linearGradient>
    <linearGradient id="corp-core-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Edge-to-edge flush background (no rounded corners, fills card frame perfectly) -->
  <rect width="300" height="420" fill="url(#corp-chip-bg)"/>

  <!-- Microchip Die Boundaries -->
  <rect x="12" y="12" width="276" height="396" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="20" y="20" width="260" height="380" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Bus Array Lines -->
  <g fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4">
    <!-- Top Bus -->
    <path d="M 40 20 V 70 H 130 V 120"/>
    <path d="M 60 20 V 60 H 140 V 120"/>
    <path d="M 80 20 V 50 H 145 V 120"/>
    <path d="M 260 20 V 70 H 170 V 120"/>
    <path d="M 240 20 V 60 H 160 V 120"/>
    <path d="M 220 20 V 50 H 155 V 120"/>
    <!-- Bottom Bus -->
    <path d="M 40 400 V 350 H 130 V 300"/>
    <path d="M 60 400 V 360 H 140 V 300"/>
    <path d="M 80 400 V 370 H 145 V 300"/>
    <path d="M 260 400 V 350 H 170 V 300"/>
    <path d="M 240 400 V 360 H 160 V 300"/>
    <path d="M 220 400 V 370 H 155 V 300"/>
    <!-- Side Bus -->
    <path d="M 20 180 H 60 L 85 195 H 95"/>
    <path d="M 20 240 H 60 L 85 225 H 95"/>
    <path d="M 280 180 H 240 L 215 195 H 205"/>
    <path d="M 280 240 H 240 L 215 225 H 205"/>
  </g>

  <!-- Chip Pins / Contact Pads -->
  <g fill="#00f0ff" opacity="0.65">
    <rect x="36" y="8" width="8" height="6"/>
    <rect x="56" y="8" width="8" height="6"/>
    <rect x="76" y="8" width="8" height="6"/>
    <rect x="216" y="8" width="8" height="6"/>
    <rect x="236" y="8" width="8" height="6"/>
    <rect x="256" y="8" width="8" height="6"/>
    <rect x="36" y="406" width="8" height="6"/>
    <rect x="56" y="406" width="8" height="6"/>
    <rect x="76" y="406" width="8" height="6"/>
    <rect x="216" y="406" width="8" height="6"/>
    <rect x="236" y="406" width="8" height="6"/>
    <rect x="256" y="406" width="8" height="6"/>
  </g>

  <!-- Micro-vias (Bus solder junctions) -->
  <g fill="#00f0ff" opacity="0.75">
    <circle cx="130" cy="70" r="2"/>
    <circle cx="140" cy="60" r="2"/>
    <circle cx="145" cy="50" r="2"/>
    <circle cx="170" cy="70" r="2"/>
    <circle cx="160" cy="60" r="2"/>
    <circle cx="155" cy="50" r="2"/>
    <circle cx="130" cy="350" r="2"/>
    <circle cx="140" cy="360" r="2"/>
    <circle cx="145" cy="370" r="2"/>
    <circle cx="170" cy="350" r="2"/>
    <circle cx="160" cy="360" r="2"/>
    <circle cx="155" cy="370" r="2"/>
  </g>

  <!-- Central Processing Unit Core -->
  <g transform="translate(150, 210)">
    <rect x="-65" y="-65" width="130" height="130" fill="#031628" stroke="#00f0ff" stroke-width="2"/>
    <rect x="-56" y="-56" width="112" height="112" fill="#010812" stroke="#0284c7" stroke-width="1"/>
    
    <!-- Concentric Heat Ring & Telemetry Pattern -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="5,3" stroke-opacity="0.8"/>
    <circle cx="0" cy="0" r="24" fill="#05223a" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="0,-14 14,0 0,14 -14,0" fill="url(#corp-core-glow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
