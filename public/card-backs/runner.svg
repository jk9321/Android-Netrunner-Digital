<svg viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="runner-chip-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14020a"/>
      <stop offset="50%" stop-color="#0a0105"/>
      <stop offset="100%" stop-color="#050002"/>
    </linearGradient>
    <linearGradient id="runner-core-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Edge-to-edge flush background (no rounded corners, fills card frame perfectly) -->
  <rect width="300" height="420" fill="url(#runner-chip-bg)"/>

  <!-- Solder Trace Boundary Frame -->
  <rect x="12" y="12" width="276" height="396" fill="none" stroke="#ff0055" stroke-width="1.5" stroke-opacity="0.35"/>
  <rect x="20" y="20" width="260" height="380" fill="none" stroke="#be123c" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Rebel Solder Wire Traces & Conduits -->
  <g fill="none" stroke="#ff0055" stroke-width="1.2" stroke-opacity="0.4">
    <!-- Top-to-center Solder Traces -->
    <path d="M 30 40 L 95 105 H 135"/>
    <path d="M 50 20 L 115 85 H 145"/>
    <path d="M 270 40 L 205 105 H 165"/>
    <path d="M 250 20 L 185 85 H 155"/>
    
    <!-- Bottom-to-center Solder Traces -->
    <path d="M 30 380 L 95 315 H 135"/>
    <path d="M 50 400 L 115 335 H 145"/>
    <path d="M 270 380 L 205 315 H 165"/>
    <path d="M 250 400 L 185 335 H 155"/>

    <!-- Direct Vertical Signal Bus -->
    <path d="M 150 20 V 75"/>
    <path d="M 150 400 V 345"/>
  </g>

  <!-- Solder Nodes / Contact Pads -->
  <g fill="#ff0055" opacity="0.75">
    <circle cx="30" cy="40" r="3"/>
    <circle cx="50" cy="20" r="3"/>
    <circle cx="270" cy="40" r="3"/>
    <circle cx="250" cy="20" r="3"/>
    <circle cx="30" cy="380" r="3"/>
    <circle cx="50" cy="400" r="3"/>
    <circle cx="270" cy="380" r="3"/>
    <circle cx="250" cy="400" r="3"/>

    <!-- Micro-junctions -->
    <circle cx="95" cy="105" r="2"/>
    <circle cx="115" cy="85" r="2"/>
    <circle cx="205" cy="105" r="2"/>
    <circle cx="185" cy="85" r="2"/>
    <circle cx="95" cy="315" r="2"/>
    <circle cx="115" cy="335" r="2"/>
    <circle cx="205" cy="315" r="2"/>
    <circle cx="185" cy="335" r="2"/>
    <circle cx="150" cy="75" r="2.5"/>
    <circle cx="150" cy="345" r="2.5"/>
  </g>

  <!-- Central Overclocked Processor Core -->
  <g transform="translate(150, 210)">
    <rect x="-65" y="-65" width="130" height="130" transform="rotate(45)" fill="#250311" stroke="#ff0055" stroke-width="2"/>
    <rect x="-52" y="-52" width="104" height="104" transform="rotate(45)" fill="#0d0106" stroke="#fb7185" stroke-width="1"/>
    
    <!-- Kinetic Decoder Diamond Core -->
    <polygon points="0,-36 36,0 0,36 -36,0" fill="#3d051c" stroke="#ff0055" stroke-width="1.5"/>
    <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#runner-core-glow)"/>
    
    <!-- Core Center Signal Dot -->
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
</svg>
