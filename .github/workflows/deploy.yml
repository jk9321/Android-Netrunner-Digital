name: Deploy

# Deploys the site and the game Workers to Cloudflare with wrangler, instead of
# Cloudflare's own Workers Builds (which bill build minutes for every branch).
#
# Automatic, only after CI passes on a push:
#   main -> the site's production deploy (stackheap.run, android-netrunner-digital.jk9321.workers.dev),
#           plus netrunner-games once main has wrangler.games.jsonc (after beta merges to main).
#   beta -> the site's "beta" preview (beta-android-netrunner-digital.jk9321.workers.dev),
#           netrunner-games-staging, and netrunner-games while main has no wrangler.games.jsonc.
# No other branch deploys by itself.
#
# By hand (Actions -> Deploy -> Run workflow, or a thread's actions_run_trigger): deploys a
# branch's tip without waiting for CI. main and beta do what they do above; any other branch
# gets a site preview at <branch>-android-netrunner-digital.jk9321.workers.dev (it talks to
# netrunner-games-staging, server/forward.ts).
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The site's own secret (GITHUB_TOKEN, for bug reports) lives in Cloudflare and carries over.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (main = production, beta = beta preview, anything else = its own preview)
        required: true
        default: beta

permissions:
  contents: read

concurrency:
  # One deploy per branch at a time; a newer one waits rather than cutting the running one off
  group: deploy-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.155.0
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    # A CI run that passed on a push to this repository (never a pull request or a fork), or a manual run
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Pick the branch and commit
        id: target
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Until the secrets are added, say so and stop (Cloudflare's own builds still deploy then)
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; nothing deployed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip=$(git ls-remote "$REPO" "refs/heads/$BRANCH" | cut -f1)
          if [ -z "$tip" ]; then echo "::error::No branch named $BRANCH"; exit 1; fi
          sha=${RUN_SHA:-$tip}
          # CI runs can finish out of order: deploy only the branch's newest commit (its own CI run deploys it)
          if [ "$sha" != "$tip" ]; then
            echo "::notice::$BRANCH has moved on from ${sha:0:7} to ${tip:0:7}; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Preview alias: lowercase letters, digits and dashes, short enough for <alias>-android-netrunner-digital
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-37 | sed -E 's/-+$//')
          {
            echo "skip=false"
            echo "branch=$BRANCH"
            echo "sha=$sha"
            echo "alias=$alias"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $BRANCH at ${sha:0:7}"

      - if: steps.target.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Does main have the game Worker config yet?
        id: main
        if: steps.target.outputs.skip == 'false'
        run: |
          git fetch --depth=1 origin main
          if git cat-file -e FETCH_HEAD:wrangler.games.jsonc 2>/dev/null; then has=true; else has=false; fi
          echo "has_games=$has" >> "$GITHUB_OUTPUT"
          echo "main has wrangler.games.jsonc: $has"

      - if: steps.target.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.target.outputs.skip == 'false'
        run: npm ci

      - name: Build the site
        if: steps.target.outputs.skip == 'false'
        run: npm run build
        env:
          # vite.config.ts reads these (the names Cloudflare's builds used): the version in bug
          # reports, and beta's test decks and tools
          WORKERS_CI_BRANCH: ${{ steps.target.outputs.branch }}
          WORKERS_CI_COMMIT_SHA: ${{ steps.target.outputs.sha }}

      # The game Workers first: the site binds to them (wrangler.jsonc services)
      - name: Deploy netrunner-games-staging
        if: steps.target.outputs.skip == 'false' && steps.target.outputs.branch == 'beta' && hashFiles('wrangler.games.staging.jsonc') != ''
        run: $WRANGLER deploy -c wrangler.games.staging.jsonc --var "BUILD_ID:${{ steps.target.outputs.sha }}"

      - name: Deploy netrunner-games
        # From main once main has the config; until then from beta (docs/multiplayer-server.md)
        if: >-
          steps.target.outputs.skip == 'false' && hashFiles('wrangler.games.jsonc') != '' &&
          (steps.target.outputs.branch == 'main' ||
           (steps.target.outputs.branch == 'beta' && steps.main.outputs.has_games == 'false'))
        run: $WRANGLER deploy -c wrangler.games.jsonc --var "BUILD_ID:${{ steps.target.outputs.sha }}"

      - name: Deploy the site (production)
        if: steps.target.outputs.skip == 'false' && steps.target.outputs.branch == 'main'
        run: $WRANGLER deploy

      - name: Upload the site preview
        if: steps.target.outputs.skip == 'false' && steps.target.outputs.branch != 'main'
        run: |
          $WRANGLER versions upload --preview-alias "${{ steps.target.outputs.alias }}" \
            --message "${{ steps.target.outputs.branch }} ${{ steps.target.outputs.sha }}"
          echo "::notice::Preview: https://${{ steps.target.outputs.alias }}-android-netrunner-digital.jk9321.workers.dev"
